name: jupyter 
author: workbench-interactive-analysis@broadinstitute.org
description: |
  Jupyter
version: 2.3.7
services:
  jupyter:
    image: "us.gcr.io/broad-dsp-gcr-public/terra-jupyter-gatk:2.3.7"
    port: 8000
    baseUrl: "/jupyter/"
    # inject a sed command to make the app listen on /jupyter instead of /notebooks
    command:  ["/bin/sh", "-c"]
    args: ["sed -i '/^# to mount there as it effectively deletes existing files on the image/,+5d' $JUPYTER_HOME/jupyter_notebook_config.py ; /usr/local/bin/jupyter notebook"]
    pdMountPath: "/data"
    pdAccessMode: "ReadWriteOnce"
    environment:
      WORKSPACE_NAME: "my-ws"
      WORKSPACE_NAMESPACE: "my-proj"
